<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Recipes</title>
<style>
  :root {
    --bg: #f6f6f3;
    --fg: #1c1c1a;
    --muted: #6b6b66;
    --card: #ffffff;
    --line: #e2e2dc;
    --accent: #0f6e56;
    --on-accent: #ffffff;
    --soft: #e4f2ec;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --fg: #eeeee9;
      --muted: #9a9a93;
      --card: #222220;
      --line: #33332f;
      --accent: #3fb895;
      --on-accent: #0b1f18;
      --soft: #1d3a30;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top, 0px);
  }

  [hidden] { display: none !important; }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 12px 12px 110px;
  }

  h1 {
    font-size: 20px;
    margin: 6px 2px 10px;
    color: var(--accent);
  }

  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin: 20px 0 8px;
  }

  small {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin: 12px 2px 4px;
  }

  /* Search and filters */

  input[type="search"] {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
  }

  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px;
  }

  .chip-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: none;
    font: inherit;
    font-size: 14px;
    min-height: 40px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
  }

  .chip.on {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
  }

  .count {
    color: var(--muted);
    font-size: 13px;
    margin: 12px 2px 0;
  }

  /* Recipe list */

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin: 10px 0;
    overflow: hidden;
  }

  .card summary {
    padding: 12px 14px;
    cursor: pointer;
    list-style: none;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .card .thumb {
    width: 64px;
    height: 64px;
    flex: none;
    object-fit: cover;
    border-radius: 10px;
    background: var(--soft);
  }

  .card .info { flex: 1; min-width: 0; }

  .card summary::-webkit-details-marker { display: none; }

  .name {
    font-weight: 600;
    font-size: 16px;
  }

  .meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .tag {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--soft);
    color: var(--accent);
  }

  .detail {
    padding: 0 14px 14px;
    border-top: 1px solid var(--line);
  }

  .detail img {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 12px;
  }

  .detail p { margin: 10px 0; }

  .awake {
    font-size: 13px;
    color: var(--muted);
    margin: 2px 2px 8px;
  }

  .times {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 14px;
    color: var(--muted);
    margin: 10px 0;
  }

  .times b {
    color: var(--fg);
    font-weight: 600;
  }

  .nutr {
    font-size: 13px;
    color: var(--muted);
  }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 12px;
  }

  /* Buttons */

  .btn {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    min-height: 44px;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    cursor: pointer;
  }

  .btn.ghost {
    background: var(--card);
    color: var(--accent);
    font-weight: 500;
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  /* Cooking checklist */

  .cook-title {
    font-size: 18px;
    font-weight: 600;
    margin: 4px 2px;
  }

  .checks {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .checks li { border-bottom: 1px solid var(--line); }

  .checks label {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 2px;
    font-size: 16px;
    line-height: 1.4;
    cursor: pointer;
  }

  .checks input {
    width: 22px;
    height: 22px;
    flex: none;
    margin-top: 1px;
    accent-color: var(--accent);
  }

  .checks li.done span {
    color: var(--muted);
    text-decoration: line-through;
  }

  /* Bottom tabs */

  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 8px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--card);
    border-top: 1px solid var(--line);
  }

  .tabbar button {
    flex: 1;
    min-height: 48px;
    border: 0;
    border-radius: 10px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }

  .tabbar button.on {
    color: var(--accent);
    font-weight: 700;
    background: var(--soft);
  }
</style>
</head>
<body>

<main>
  <section id="recipes-view" class="view">
    <h1>Recipes</h1>
    <input id="search" type="search" placeholder="Search name, ingredient, protein…" autocomplete="off">

    <small>Protein</small>
    <div class="chip-row" id="protein-chips"></div>

    <small>Dish type</small>
    <div class="chip-row" id="dish-chips"></div>

    <small>Cuisine</small>
    <div class="chip-row" id="cuisine-chips"></div>

    <p class="count" id="count"></p>
    <div id="list"></div>
  </section>

  <section id="cooking-view" class="view" hidden>
    <h1>Cooking</h1>
    <div id="cooking"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="on" data-tab="recipes-view">Recipes</button>
  <button data-tab="cooking-view">Cooking</button>
</nav>

<script>
// The build script replaces this placeholder with your recipes.
const RECIPES = [{"id":"bdb81e1c","name":"Cauliflower Fried Rice","url":"https://www.delish.com/cooking/recipe-ideas/a46782/cauliflower-fried-rice-recipe/","source":"delish.com","description":"Whether you’re skipping carbs, trying to eat more vegetables, or are just looking for a lighter side dish, this easy cauliflower fried rice recipe is for you.","dish_type":"Entree","cuisine":"Japanese","protein":["Other"],"prep_min":20,"cook_min":null,"total_min":50,"yield":"4 - 6 serving(s)","rating":5.0,"keywords":["cauliflower fried rice, cauliflower, fried rice, rice","OCCASION: weeknight meals","CATEGORY: dinner"],"nutrition":[["Calories","253 Calories"],["Fat","18 g"],["Saturated fat","2 g"],["Cholesterol","93 mg"],["Sodium","473 mg"],["Carbs","12 g"],["Fiber","4 g"],["Sugar","7 g"],["Protein","8 g"]],"ingredients":["1 small head of cauliflower or 1 (10- to 12-oz.) bag pre-riced cauliflower","3 tbsp. reduced-sodium soy sauce","2 tbsp. mirin","1 tsp. granulated sugar","1/4 c. neutral oil","2 shallots, thinly sliced","2 large eggs, beaten to blend","1 carrot, cut into 1/4\" matchsticks","3 cloves garlic, finely chopped","1/2 c. frozen peas","Kosher salt","Freshly ground black pepper","2 scallions, thinly sliced","Sesame seeds, for serving (optional)"],"steps":["Cut cauliflower into florets. In a food processor, pulse florets until rice-sized pieces form. (Skip this step if using pre-riced cauliflower.) Place cauliflower in a clean kitchen towel. Squeeze out excess moisture. (Do this with pre-riced cauliflower as well to ensure rice is dry.)","In a small bowl, stir soy sauce, mirin, and sugar; set aside.","In a large nonstick skillet or wok over medium-high heat, heat oil until just shimmering. Add shallots and cook, stirring occasionally, until golden brown, 1 to 2 minutes. Transfer shallots to a paper-towel lined plate. Discard all but 1 Tbsp. oil from skillet.","In same skillet over medium-high heat, cook eggs, stirring occasionally, until scrambled, about 30 seconds. Transfer eggs to a small bowl.","In same skillet over medium-high heat, cook carrots, garlic, and peas, stirring frequently, until warmed through, about 30 seconds. Add cauliflower and stir to combine. Cook, stirring occasionally, until vegetables are slightly softened, about 2 minutes.","Increase heat to high. Add reserved soy sauce mixture and cook, stirring frequently, until liquid is mostly evaporated, about 1 minute. Stir in eggs; season with salt and pepper.","Divide fried rice among small bowls. Top with shallots, scallions, and sesame seeds (if using)."],"thumb":"images/bdb81e1c.jpg"},{"id":"0244456a","name":"Chicken Tostadas","url":"https://www.delish.com/cooking/recipe-ideas/a39951906/chicken-tostadas-recipe/","source":"delish.com","description":"Our chicken tostadas recipe comes complete with homemade refried black beans, saucy shredded chicken, and plenty of toppings.","dish_type":"Entree","cuisine":"Mexican","protein":["Chicken"],"prep_min":25,"cook_min":null,"total_min":50,"yield":"4 serving(s)","rating":5.0,"keywords":["dinner, easy chicken, poultry, weeknight meals","OCCASION: easy chicken","OCCASION: weeknight meals","CATEGORY: dinner","CATEGORY: poultry"],"nutrition":[["Calories","1337 Calories"],["Fat","75 g"],["Saturated fat","24 g"],["Cholesterol","187 mg"],["Sodium","2294 mg"],["Carbs","85 g"],["Fiber","21 g"],["Sugar","6 g"],["Protein","69 g"]],"ingredients":["5 tbsp. neutral oil, divided","1 large white onion, one-half finely chopped, one-half thinly sliced","1 tsp. ground cumin","3 tsp. kosher salt, divided","1 tsp. freshly ground black pepper, divided","2 (15.5-oz.) cans black beans, rinsed and drained","2 c. low-sodium chicken broth, divided","2 tbsp. fresh lime juice","4 cloves garlic, finely chopped","1 jalapeño, finely chopped (optional)","1 (4-oz.) can diced green chile peppers","4 c. shredded rotisserie chicken","1/2 c. chopped cilantro leaves, plus more for serving","8 store-bought tostadas (deep-fried flat corn tortillas)","3 c. shredded romaine","1 avocado, sliced","1 c. crumbled queso fresco or cotija cheese","Lime wedges, for serving"],"steps":["In a large skillet over medium-high heat, heat 3 tbsp. oil. Add finely chopped onion, cumin, 1 1/2 tsp. salt, and 1 tsp. black pepper. Cook, stirring occasionally, until onion has softened, about 5 minutes. Add beans and 1 c. broth and cook, stirring occasionally, until most liquid has reduced, 5 to 7 minutes. Continue to cook, using a potato masher or fork to smash beans, until smooth, 3 to 5 minutes. Remove from heat and stir in lime juice.","Meanwhile, in a medium pot over medium heat, heat remaining 2 tbsp. oil. Add sliced onion and remaining 1 1/2 tsp. salt and 1 tsp. black pepper. Cover and cook, stirring occasionally, until onions have softened slightly, 3 to 5 minutes. Add garlic and jalapeño, if using, and cook, stirring, until fragrant, about 1 minute. Stir in green chiles and remaining 1 c. broth. Increase heat to medium-high and cook, stirring occasionally, until reduced by half, 5-7 minutes. Stir in chicken until warmed through. Remove from heat and stir in cilantro.","Top tostadas with bean mixture, chicken mixture, romaine, avocado, and queso fresco. Garnish with more cilantro. Serve with lime wedges alongside."],"thumb":"images/0244456a.jpg"},{"id":"43c3a204","name":"Chili Crisp Fried Tofu","url":"https://www.delish.com/cooking/recipe-ideas/a62964331/chili-crisp-fried-tofu-recipe/","source":"delish.com","description":"Featuring a vibrant sauce made with just four pantry ingredients, this crunchy chili crisp fried tofu promises to spice up your weeknight dinner.","dish_type":"Entree","cuisine":"Asian","protein":["Tofu"],"prep_min":5,"cook_min":null,"total_min":45,"yield":"3 - 4 serving(s)","rating":4.4,"keywords":["Asian, dairy-free, dinner, vegan, vegetarian, weeknight meals, winter","OCCASION: weeknight meals","OCCASION: winter","CATEGORY: dinner"],"nutrition":[["Calories","553 Calories"],["Fat","30 g"],["Saturated fat","3 g"],["Cholesterol","0 mg"],["Sodium","627 mg"],["Carbs","58 g"],["Fiber","2 g"],["Sugar","24 g"],["Protein","15 g"]],"ingredients":["1 (14-oz.) pkg. extra-firm tofu","2 tbsp. kosher salt, plus more","1/4 c. chili crisp (mostly the crisp solids)","1/4 c. honey","2 tbsp. reduced-sodium soy sauce","1/3 c. plus 2 tsp. cornstarch, divided","1/3 c. neutral oil","1 scallion, thinly sliced, for serving","Cooked white rice, for serving"],"steps":["Remove tofu from package; discard excess moisture. On a cutting board, holding knife parallel to board, slice tofu block in half to yield 2 thinner blocks. Cut each block into 12 cubes about 1\" x 1\" each. Arrange in an 8\" x 8\" baking dish in a single layer.","In a kettle or medium pot, bring 6 cups water to a boil. Pour water over tofu; sprinkle with 2 Tbsp. salt. Let sit 20 minutes.","Meanwhile, in a small bowl, whisk chili crisp, honey, soy sauce, and 2 tsp. cornstarch. Place remaining 1/3 cup cornstarch in another small bowl.","Line half of a baking sheet with 2 layers of paper towels or a clean kitchen towel.","Working one or two at a time, remove tofu cubes from water and blot dry on all sides with more paper towels. Arrange on paper towels on prepared sheet. Cover with more paper towels or another clean kitchen towel and lightly pat dry again (do not apply too much pressure).","Working one or two at a time, transfer tofu cubes to cornstarch and toss to coat. Shake of excess and transfer to unlined part of baking sheet. Remove wet paper towels from baking sheet and line with fresh paper towels.","In a large, heavy, high-sided stainless steel or cast-iron skillet over medium-high heat, heat oil until shimmering. Fry tofu in a single layer, turning occasionally, until browned on all sides, 5 to 6 minutes. Transfer to prepared sheet; season with salt, if desired.","Pour off remaining oil into a heatproof bowl (discard once cool). Return skillet to medium heat.","Whisk chili crisp sauce to reincorporate and pour into skillet. Bring to a simmer and cook, stirring, until thickened, 30 to 60 seconds. Add tofu and toss in sauce until coated and warmed through.","Divide rice among bowls. Top with tofu mixture and scallions."],"thumb":"images/43c3a204.jpg"},{"id":"27ffaebf","name":"General Tso's Chickpeas","url":"https://www.delish.com/cooking/recipe-ideas/a35645824/best-general-tsos-chickpeas-recipe/","source":"delish.com","description":"You know the OG dish featuring chicken, but how about a veggie-forward one that features chickpeas? We've got you covered with this super savory stir-fry.","dish_type":"Entree","cuisine":"Chinese","protein":["Vegan"],"prep_min":20,"cook_min":null,"total_min":50,"yield":"2 serving(s)","rating":4.1,"keywords":["American, dinner, lunch, vegan, vegetarian, weeknight meals","OCCASION: weeknight meals","CATEGORY: dinner","CATEGORY: lunch"],"nutrition":[["Calories","858 Calories"],["Fat","43 g"],["Saturated fat","4 g"],["Cholesterol","0 mg"],["Sodium","1369 mg"],["Carbs","85 g"],["Fiber","15 g"],["Sugar","26 g"],["Protein","20 g"]],"ingredients":["1 (15-oz.) can chickpeas, drained","1 tbsp. reduced-sodium soy sauce","1 tbsp. rice wine vinegar","1 tbsp. Sriracha","2 tbsp. cornstarch","2 garlic cloves, finely grated","1/3 c. low-sodium vegetable broth","3 tbsp. rice wine vinegar","2 tbsp. packed light brown sugar","1 tbsp. finely grated peeled ginger","1 tbsp. hoisin sauce","1 tbsp. toasted sesame oil","1/4 c. peanut or neutral oil","1 long red chile, ribs and seeds removed, thinly sliced lengthwise (optional)","2 garlic cloves, thinly sliced","1 tsp. crushed red pepper flakes","Toasted sesame seeds, thinly sliced scallions, and cooked white rice, for serving"],"steps":["In a medium bowl, toss chickpeas, soy sauce, vinegar, and sriracha. Let sit 10 minutes, then drain and reserve liquid. Add cornstarch to chickpeas and toss to coat.","Meanwhile, in a small bowl, whisk garlic, broth, vinegar, brown sugar, ginger, hoisin sauce, soy sauce, and sesame oil; set aside until ready to use.","In a large skillet over medium heat, heat peanut oil. Fry chickpeas, stirring occasionally, until golden and crispy, 8 to 10 minutes. Transfer chickpeas to a plate; reserve oil in skillet.","Return skillet to medium heat. Cook red chile (if using), garlic, and red pepper flakes, stirring occasionally, until chile is lightly toasted, about 1 minute.","Slowly add sauce to skillet and stir until slightly thickened, 1 to 2 minutes. Return chickpeas to skillet and stir until coated in sauce. Remove from heat.","Divide rice among bowls. Spoon chickpea mixture over. Top with sesame seeds and scallions."],"thumb":"images/27ffaebf.jpg"},{"id":"3007bcdd","name":"Marry Me Tofu","url":"https://www.delish.com/cooking/recipe-ideas/a63411814/best-marry-me-tofu-recipe/","source":"delish.com","description":"Our Marry Me tofu combines our famous, creamy, garlicky sauce with crispy tofu for an unbeatable vegetarian dinner.","dish_type":"Entree","cuisine":"Italian","protein":["Tofu"],"prep_min":10,"cook_min":null,"total_min":55,"yield":"4 serving(s)","rating":4.5,"keywords":["OCCASION: date night","OCCASION: dinner party","OCCASION: weeknight meals","CATEGORY: dinner","CATEGORY: main dish"],"nutrition":[["Calories","569 Calories"],["Fat","51 g"],["Saturated fat","23 g"],["Cholesterol","98 mg"],["Sodium","1079 mg"],["Carbs","14 g"],["Fiber","2 g"],["Sugar","3 g"],["Protein","16 g"]],"ingredients":["1 (14-oz.) block extra-firm tofu","4 garlic cloves, divided","4 c. water","2 tbsp. kosher salt, plus more","1 1/4 tsp. dried oregano, divided","1 tsp. plus a pinch of crushed red pepper flakes, divided","3 tbsp. cornstarch","1/2 tsp. onion powder","1/2 tsp. smoked paprika","1/4 c. extra-virgin olive oil","1 tbsp. unsalted butter","1 tbsp. tomato paste","1 1/4 c. (or more) heavy cream","1/3 c. oil-packed sun-dried tomatoes, finely chopped","1/4 c. grated Parmesan, plus more for serving","1/2 c. fresh basil leaves, torn, plus more for serving","Freshly ground black pepper"],"steps":["Drain tofu, then cut block in half crosswise. Cut each half into 1\" pieces. Poke each piece with a fork. Arrange in a 9\" x 9\" baking dish in a single layer.","Peel and smash 2 garlic cloves and transfer to a small saucepan. Add water, 2 Tbsp. salt, 1/2 tsp. oregano, and 1/2 tsp. red pepper flakes and bring to a boil over high heat. Pour brine over tofu. Let sit 20 minutes.","Line a baking sheet with paper towels or a clean kitchen towel. Working one or two at a time, remove tofu from brine and pat dry on all sides with more paper towels. Arrange on prepared sheet. Cover with more paper towels or another clean kitchen towel and lightly pat dry again (do not apply too much pressure).","In a shallow bowl, combine cornstarch, onion powder, paprika, 1/2 tsp. oregano, 1/2 tsp. red pepper flakes, and a pinch of salt. Transfer tofu to bowl and gently toss to coat in cornstarch mixture. Discard paper towels. Set a wire rack over same baking sheet.","In a large nonstick skillet over medium-high heat, heat oil. Add tofu and cook, turning occasionally, until browned on all sides, about 10 minutes. Transfer to prepared rack; season with salt. Wipe out skillet.","Finely chop remaining 2 garlic cloves. In same skillet over medium heat, melt butter. Add chopped garlic and remaining 1/4 tsp. oregano and pinch of red pepper flakes. Cook, stirring, until fragrant, about 30 seconds. Add tomato paste and cook, stirring, until paste is brick-red, about 30 seconds more. Add cream, tomatoes, and Parmesan. Cook, stirring, until cheese is melted, about 2 minutes.","Add tofu and basil to skillet and cook, stirring, until warmed through, about 30 seconds; season with salt and black pepper. Add more cream, 1 Tbsp. at a time, if sauce is too thick. Top with more basil and Parmesan."],"thumb":"images/3007bcdd.jpg"},{"id":"c1ce8248","name":"One-Skillet Creamy Thai Basil Chicken","url":"https://www.delish.com/cooking/recipe-ideas/a41871156/one-skillet-thai-basil-skillet-recipe/","source":"delish.com const PROGRESS_KEY = "recipeProgress";
const COOKING_KEY = "cookingRecipeId";

let progress = loadJSON(PROGRESS_KEY, {});
let cookingId = loadJSON(COOKING_KEY, "") || "";
let filters = { protein: "", dish: "", cuisine: "" };
const openIds = new Set();

const $ = id => document.getElementById(id);

// ---------- small helpers ----------

function loadJSON(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  } catch (e) {
    return fallback;
  }
}

function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtTime(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return [h ? h + "h" : "", m ? m + "m" : ""].filter(Boolean).join(" ");
}

function uniqueValues(list) {
  return [...new Set(list.flat().filter(Boolean))].sort();
}

// ---------- filter chips ----------

function buildChips(containerId, values, filterKey) {
  const row = $(containerId);
  row.innerHTML = "";
  ["", ...values].forEach(value => {
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.filter = filterKey;
    b.dataset.value = value;
    b.textContent = value || "All";
    row.appendChild(b);
  });
}

function markChips() {
  document.querySelectorAll(".chip").forEach(chip => {
    chip.classList.toggle("on", filters[chip.dataset.filter] === chip.dataset.value);
  });
}

// ---------- recipe list ----------

function matches(r, query) {
  if (filters.protein && !(r.protein || []).includes(filters.protein)) return false;
  if (filters.dish && r.dish_type !== filters.dish) return false;
  if (filters.cuisine && r.cuisine !== filters.cuisine) return false;
  if (!query) return true;
  const haystack = [r.name, r.dish_type, r.cuisine, ...(r.protein || []),
                    ...(r.keywords || []), ...(r.ingredients || [])].join(" ").toLowerCase();
  // Every word typed must appear somewhere, so "chicken lemon" finds both.
  return query.split(/\s+/).every(word => haystack.includes(word));
}

function timesHtml(r) {
  return [["Prep", r.prep_min], ["Cook", r.cook_min], ["Total", r.total_min]]
    .filter(([, v]) => v)
    .map(([label, v]) => `<span><b>${label}</b> ${fmtTime(v)}</span>`)
    .join("");
}

function recipeCard(r) {
  const meta = [
    r.total_min ? "⏱ " + fmtTime(r.total_min) : "",
    r.yield,
    r.rating ? "★ " + Number(r.rating).toFixed(1) : "",
  ].filter(Boolean).join(" · ");

  const tags = [...(r.protein || []), r.dish_type, r.cuisine]
    .filter(Boolean)
    .map(t => `<span class="tag">${esc(t)}</span>`)
    .join("");

  // Local thumbnail if the script made one, otherwise the original web image.
  const pic = r.thumb || r.image || "";

  const nutrition = (r.nutrition || []).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join(" · ");

  return `
    <details class="card" data-id="${esc(r.id)}"${openIds.has(r.id) ? " open" : ""}>
      <summary>
        ${pic ? `<img class="thumb" src="${esc(pic)}" alt="" loading="lazy">` : ""}
        <div class="info">
          <div class="name">${esc(r.name)}</div>
          <div class="meta">${esc(meta)}</div>
          <div class="tags">${tags}</div>
        </div>
      </summary>
      <div class="detail">
        ${r.description ? `<p>${esc(r.description)}</p>` : ""}
        <div class="times">${timesHtml(r)}</div>
        ${nutrition ? `<p class="nutr">${nutrition}</p>` : ""}
        <div class="btn-row">
          <button class="btn" data-cook="${esc(r.id)}">Cook this</button>
          <a class="btn ghost" href="${esc(r.url)}" target="_blank" rel="noopener">View on ${esc(r.source)}</a>
        </div>
      </div>
    </details>`;
}

function renderList() {
  const query = $("search").value.trim().toLowerCase();
  const shown = RECIPES.filter(r => matches(r, query));
  $("count").textContent = `${shown.length} of ${RECIPES.length} recipes`;
  $("list").innerHTML = shown.map(recipeCard).join("") ||
    `<p class="empty">No recipes match those filters.</p>`;
  markChips();
}

// ---------- cooking checklist ----------

function checkItem(id, kind, i, text, done, prefix = "") {
  const checked = done.includes(i);
  return `
    <li class="${checked ? "done" : ""}">
      <label>
        <input type="checkbox" data-id="${esc(id)}" data-kind="${kind}" data-i="${i}" ${checked ? "checked" : ""}>
        <span>${esc(prefix + text)}</span>
      </label>
    </li>`;
}

function renderCooking() {
  const r = RECIPES.find(x => x.id === cookingId);
  if (!r) {
    $("cooking").innerHTML =
      `<p class="empty">No recipe selected.<br>Open one on the Recipes tab and tap “Cook this”.</p>`;
    return;
  }
  const p = progress[r.id] || { ing: [], steps: [] };
  const meta = [r.yield, r.total_min ? "⏱ " + fmtTime(r.total_min) : ""].filter(Boolean).join(" · ");

  $("cooking").innerHTML = `
    <div class="cook-title">${esc(r.name)}</div>
    <div class="meta">${esc(meta)}</div>
    <div class="awake" id="awake"></div>

    <h2>Ingredients</h2>
    <ul class="checks">
      ${r.ingredients.map((t, i) => checkItem(r.id, "ing", i, t, p.ing)).join("")}
    </ul>

    <h2>Steps</h2>
    <ul class="checks">
      ${r.steps.map((t, i) => checkItem(r.id, "steps", i, t, p.steps, `${i + 1}. `)).join("")}
    </ul>

    <div class="btn-row">
      <button class="btn ghost" data-reset="${esc(r.id)}">Reset checkboxes</button>
      <button class="btn ghost" data-stop="1">Stop cooking</button>
    </div>`;
}

// ---------- tabs ----------

function showView(viewId) {
  document.querySelectorAll(".view").forEach(v => { v.hidden = v.id !== viewId; });
  document.querySelectorAll(".tabbar button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === viewId);
  });
  if (viewId === "cooking-view") renderCooking();
  updateWakeLock();
  window.scrollTo(0, 0);
}

// ---------- keep the screen on while cooking ----------

let wakeLock = null;

function cookingVisible() {
  return !$("cooking-view").hidden && !!cookingId && document.visibilityState === "visible";
}

function showAwake(text) {
  const el = $("awake");
  if (el) el.textContent = text;
}

async function updateWakeLock() {
  if (!("wakeLock" in navigator)) { showAwake(""); return; }
  try {
    if (cookingVisible() && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!cookingVisible() && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (e) { wakeLock = null; }
  showAwake(wakeLock ? "Screen will stay on while you cook." : "");
}

// The phone drops the lock when you switch apps, so ask again on return.
document.addEventListener("visibilitychange", updateWakeLock);

// ---------- events ----------

// One click handler for everything that's a button or chip.
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) return showView(tab.dataset.tab);

  const chip = e.target.closest(".chip");
  if (chip) {
    filters[chip.dataset.filter] = chip.dataset.value;
    renderList();
    return;
  }

  const cook = e.target.closest("[data-cook]");
  if (cook) {
    cookingId = cook.dataset.cook;
    store(COOKING_KEY, cookingId);
    showView("cooking-view");
    return;
  }

  const reset = e.target.closest("[data-reset]");
  if (reset) {
    delete progress[reset.dataset.reset];
    store(PROGRESS_KEY, progress);
    renderCooking();
    return;
  }

  if (e.target.closest("[data-stop]")) {
    cookingId = "";
    store(COOKING_KEY, cookingId);
    renderCooking();
    updateWakeLock();
  }
});

// Keep expanded recipe cards open while you type or change filters.
$("list").addEventListener("toggle", e => {
  if (e.target.tagName !== "DETAILS") return;
  if (e.target.open) openIds.add(e.target.dataset.id);
  else openIds.delete(e.target.dataset.id);
}, true);

$("search").addEventListener("input", renderList);

// Save checkbox progress on this phone.
$("cooking").addEventListener("change", e => {
  const cb = e.target;
  if (cb.type !== "checkbox") return;
  const id = cb.dataset.id;
  const kind = cb.dataset.kind;
  const i = Number(cb.dataset.i);
  const entry = progress[id] || (progress[id] = { ing: [], steps: [] });
  const list = entry[kind];
  const pos = list.indexOf(i);
  if (cb.checked && pos === -1) list.push(i);
  if (!cb.checked && pos !== -1) list.splice(pos, 1);
  store(PROGRESS_KEY, progress);
  cb.closest("li").classList.toggle("done", cb.checked);
});

// ---------- start up ----------

buildChips("protein-chips", uniqueValues(RECIPES.map(r => r.protein || [])), "protein");
buildChips("dish-chips", uniqueValues(RECIPES.map(r => r.dish_type)), "dish");
buildChips("cuisine-chips", uniqueValues(RECIPES.map(r => r.cuisine)), "cuisine");
renderList();

// ---------- offline support ----------
// Only works over https (GitHub Pages), not when opened as a local file.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
